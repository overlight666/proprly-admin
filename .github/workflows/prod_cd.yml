name: Continous Deployment [Production]
on:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create Deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST https://api.github.com/repos/${{ github.repository }}/deployments \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{
              "ref": "${{ github.sha }}",
              "environment": "production",
              "required_contexts": [],
              "auto_merge": false,
              "description": "Deployment triggered from GitHub Actions"
            }' > deployment.json

      - name: Get Deployment ID
        run: |
          cat deployment.json
          echo "DEPLOYMENT_ID=$(jq -r .id deployment.json)" >> $GITHUB_ENV

      - name: Update Deployment Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST https://api.github.com/repos/${{ github.repository }}/deployments/${{ env.DEPLOYMENT_ID }}/statuses \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{
              "state": "success",
              "environment": "production",
              "description": "Deployed to production server"
            }'
